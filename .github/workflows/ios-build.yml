name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "Minecraft.Client/**"
      - "Minecraft.World/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  source-audit:
    name: Audit C++ sources for iOS porting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate source inventory
        run: python3 ios/tools/audit_sources.py build/ios/source-inventory.json

      - name: Generate renderer API dependency inventory
        run: python3 ios/tools/audit_renderer_api.py build/ios/renderer-api-inventory.json

      - name: Audit available renderer implementation sources
        run: python3 ios/tools/audit_renderer_implementation.py build/ios/renderer-implementation-inventory.json

      - name: Test iOS conditional dependency filtering
        run: python3 -m unittest discover -s ios/tools/tests -p "test_*.py" -v

      - name: Probe transitive C++ dependencies for iOS
        run: python3 ios/tools/probe_portable_sources.py build/ios/portable-source-probe.json

      - name: Upload source inventory
        uses: actions/upload-artifact@v4
        with:
          name: LegacyMobile-source-inventory
          path: build/ios/source-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload renderer API inventory
        uses: actions/upload-artifact@v4
        with:
          name: LegacyMobile-renderer-api-inventory
          path: build/ios/renderer-api-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload renderer implementation inventory
        uses: actions/upload-artifact@v4
        with:
          name: LegacyMobile-renderer-implementation-inventory
          path: build/ios/renderer-implementation-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable source probe
        uses: actions/upload-artifact@v4
        with:
          name: LegacyMobile-portable-source-probe
          path: build/ios/portable-source-probe.json
          if-no-files-found: error
          retention-days: 14

  mobile-input-tests:
    name: Test mobile input arbitration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile mobile input tests
        run: |
          set -euo pipefail
          mkdir -p build/ios
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            ios/input/MobileInputState.cpp \
            ios/input/tests/MobileInputStateTests.cpp \
            -o build/ios/mobile-input-tests

      - name: Run mobile input tests
        run: ./build/ios/mobile-input-tests

      - name: Compile portable renderer matrix tests
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            ios/renderer/MatrixStacks.cpp \
            ios/renderer/tests/MatrixStacksTests.cpp \
            -o build/ios/renderer-matrix-tests

      - name: Run portable renderer matrix tests
        run: ./build/ios/renderer-matrix-tests

  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(".")
          workspaces = sorted(
              p for p in root.rglob("*.xcworkspace")
              if "Pods" not in p.parts and p.is_dir()
          )
          projects = sorted(
              p for p in root.rglob("*.xcodeproj")
              if "Pods" not in p.parts and p.is_dir()
          )

          if workspaces:
              kind, path = "workspace", workspaces[0]
          elif projects:
              kind, path = "project", projects[0]
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("found=false\n")
              print("::error title=No iOS app target::No .xcodeproj or .xcworkspace exists. Source audits may pass, but this job cannot claim an IPA build until a real iOS app target is added.")
              raise SystemExit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("found=true\n")
              output.write(f"kind={kind}\n")
              output.write(f"path={path}\n")
          print(f"Using {kind}: {path}")
          PY

      - name: Select an Xcode scheme
        if: steps.project.outputs.found == 'true'
        id: scheme
        shell: bash
        env:
          PROJECT_KIND: ${{ steps.project.outputs.kind }}
          PROJECT_PATH: ${{ steps.project.outputs.path }}
        run: |
          set -euo pipefail
          if [ "$PROJECT_KIND" = "workspace" ]; then
            LIST_JSON="$(xcodebuild -list -json -workspace "$PROJECT_PATH")"
          else
            LIST_JSON="$(xcodebuild -list -json -project "$PROJECT_PATH")"
          fi

          SCHEME="$(printf '%s' "$LIST_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); k="workspace" if "workspace" in d else "project"; s=d[k].get("schemes", []); print(s[0] if s else "")')"
          if [ -z "$SCHEME" ]; then
            echo "::error title=No shared Xcode scheme::The iOS project exists but Xcode reported no schemes. Add/share an app scheme before building."
            exit 1
          fi
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Selected scheme: $SCHEME"

      - name: Archive for generic iOS device without signing
        if: steps.project.outputs.found == 'true'
        shell: bash
        env:
          PROJECT_KIND: ${{ steps.project.outputs.kind }}
          PROJECT_PATH: ${{ steps.project.outputs.path }}
          SCHEME: ${{ steps.scheme.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p build/ios
          COMMON_ARGS=(
            -scheme "$SCHEME"
            -configuration Release
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -archivePath "$PWD/build/ios/LegacyMobile.xcarchive"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
          )

          if [ "$PROJECT_KIND" = "workspace" ]; then
            xcodebuild -workspace "$PROJECT_PATH" "${COMMON_ARGS[@]}" archive
          else
            xcodebuild -project "$PROJECT_PATH" "${COMMON_ARGS[@]}" archive
          fi

      - name: Package unsigned IPA
        if: steps.project.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/ios/LegacyMobile.xcarchive/Products/Applications"
          APP="$(find "$APP_PATH" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error title=No archived iOS app::Xcode completed without producing an .app in the archive."
            exit 1
          fi

          mkdir -p build/ios/ipa/Payload
          cp -R "$APP" build/ios/ipa/Payload/
          (cd build/ios/ipa && /usr/bin/zip -qry "$PWD/../LegacyMobile-unsigned.ipa" Payload)
          test -s build/ios/LegacyMobile-unsigned.ipa

      - name: Upload unsigned IPA
        if: steps.project.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LegacyMobile-unsigned-ipa
          path: build/ios/LegacyMobile-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode archive for debugging
        if: always() && steps.project.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LegacyMobile-ios-archive
          path: build/ios/LegacyMobile.xcarchive
          if-no-files-found: ignore
          retention-days: 7
