name: LegacyMobile
options:
  bundleIdPrefix: site.legacy-mobile
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  LegacyMobile:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../Minecraft.World/Vec3.cpp
      - path: ../Minecraft.World/Random.cpp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.legacy-mobile.app
        PRODUCT_NAME: LegacyMobile
        INFOPLIST_KEY_CFBundleDisplayName: LegacyMobile
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_OBJC_BRIDGING_HEADER: App/LegacyMobile-Bridging-Header.h
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - IOS_PORT=1
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../Minecraft.World
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        DEAD_CODE_STRIPPING: YES
