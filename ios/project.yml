name: LegacyMobile
options:
  bundleIdPrefix: site.legacy-mobile
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  LegacyMobile:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.legacy-mobile.app
        PRODUCT_NAME: LegacyMobile
        INFOPLIST_KEY_CFBundleDisplayName: LegacyMobile
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO
